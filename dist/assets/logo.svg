<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Brand Gradients (corporate navy / blue) -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <g transform="translate(0, 0)" filter="url(#neonGlow)">
    <!-- Stylized Outer P Stem & Arch -->
    <path d="M 140 100 
             C 280 80, 410 130, 410 240 
             C 410 340, 290 380, 200 360 
             L 200 420 
             C 200 435, 185 445, 170 440 
             L 150 432 
             C 140 428, 140 415, 140 405 
             Z" 
          fill="none" 
          stroke="url(#pGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Gear Element (Workbench / Engine) -->
    <path d="M 270 170 A 55 55 0 1 1 269.9 170 Z" 
          fill="none" 
          stroke="url(#gearGrad)" 
          stroke-width="14" 
          stroke-dasharray="24 12" />

    <!-- Core Lightning Bolt (Performance / Fast Utilities) -->
    <path d="M 285 140 
             L 230 245 
             L 275 245 
             L 225 350 
             L 300 225 
             L 255 225 
             Z" 
          fill="url(#boltGrad)"/>

    <!-- Precision Bench / Platform Line -->
    <path d="M 190 320 L 330 320" 
          stroke="url(#pGrad)" 
          stroke-width="18" 
          stroke-linecap="round"/>
  </g>
</svg>
